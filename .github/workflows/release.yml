name: Release
on:
  push:
    branches:
      - main
concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  id-token: write # Required for OIDC
  contents: write # Required for changesets to commit/push
  pull-requests: write # Required for changesets to create version PRs
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # `pnpm run release` uploads the Studio's bundler wasm to
          # content.val.build before it publishes (rolldown:upload). Only
          # needed when the wasm changed -- it is content-addressed, so an
          # unchanged one is found and nothing is sent. Same value as the
          # secret of this name on valbuild/home.
          VAL_STATIC_UPLOAD_TOKEN: ${{ secrets.VAL_STATIC_UPLOAD_TOKEN }}
