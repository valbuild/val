name: Check
on: push
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
  build-next:
    name: Build Next.js example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        working-directory: examples/next
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run -r typecheck
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    # The whole fs-mode suite (workers: 1 — see playwright.config.ts, they
    # share one disk-backed patch store) has taken up to ~24 minutes; give it
    # room rather than have the job itself become the flaky part.
    timeout-minutes: 40
    strategy:
      # One project's failure should not hide the other's result.
      fail-fast: false
      matrix:
        # Not `screens`: it takes screenshots for a human, not assertions, and
        # must never be able to fail this gate. See playwright.config.ts.
        project: [chromium, chromium-http]
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      # A runner has no browser at the sandbox's preinstalled path
      # (playwright.config.ts's PREINSTALLED_CHROMIUM), so it resolves and
      # downloads its own — `--with-deps` also installs the OS libraries a bare
      # runner is missing (fonts, codecs) that a headless Chromium needs.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      # Traces and screenshots only exist for a failure (`trace: retain-on-
      # failure`, `screenshot: only-on-failure` in playwright.config.ts), so
      # this only ever uploads something worth looking at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
